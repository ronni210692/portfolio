<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Study — Ronni Cohen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── Case Study Page ── */
    body { background: #f0f0ef; }

    .cs-page { padding-top: 80px; min-height: 100vh; }

    .cs-wrap {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      max-width: 1240px;
      margin: 0 auto;
      padding: 48px 40px 80px;
      align-items: start;
    }

    /* ── Left sticky panel ── */
    .cs-left {
      position: sticky;
      top: 104px;
    }

    .cs-left-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px;
    }

    .cs-left-card .section-pill {
      font-size: 12px;
    }

    .cs-title {
      font-family: 'Google Sans', 'Nunito Sans', sans-serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      margin: 14px 0 16px;
      color: #1a1a1a;
    }

    .cs-desc {
      font-size: 0.875rem;
      color: #666;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .cs-cta-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #1a1a1a;
      color: #fff;
      border-radius: 980px;
      padding: 14px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 28px;
    }
    .cs-cta-btn:hover { background: #333; }

    .cs-meta {
      border-top: 1px solid #ebebeb;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cs-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.8rem;
    }

    .cs-meta-label { color: #aaa; flex-shrink: 0; }
    .cs-meta-value { text-align: right; font-weight: 500; color: #1a1a1a; }

    /* ── Right scrollable panel ── */
    .cs-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cs-block { border-radius: 20px; overflow: hidden; }

    .cs-block-img { background: #1a1a1a; }
    .cs-block-img img { width: 100%; display: block; }

    .cs-block-text {
      background: #fff;
      padding: 44px;
    }

    .cs-block-text .section-pill { font-size: 12px; }

    .cs-block-heading {
      font-family: 'Google Sans', 'Nunito Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.35;
      margin: 14px 0 16px;
      color: #1a1a1a;
    }

    .cs-block-body {
      font-size: 0.875rem;
      color: #555;
      line-height: 1.75;
    }
    .cs-block-body strong { color: #1a1a1a; }

    .cs-block-video iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: none;
    }

    /* ── Loading / 404 ── */
    .cs-loading, .cs-notfound {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: #888;
    }
    .cs-loading-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ccc; animation: csdot .9s infinite alternate;
      display: inline-block;
    }
    .cs-loading-dot:nth-child(2) { animation-delay: .2s; }
    .cs-loading-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes csdot { to { background: #1a1a1a; transform: scale(1.3); } }

    .cs-back {
      position: fixed;
      top: 90px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .82rem;
      font-weight: 500;
      color: #666;
      text-decoration: none;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(8px);
      border-radius: 980px;
      padding: 6px 14px 6px 10px;
      border: 1px solid #e0e0e0;
      transition: color .15s;
      z-index: 50;
    }
    .cs-back:hover { color: #1a1a1a; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .cs-wrap {
        grid-template-columns: 1fr;
        padding: 24px 20px 60px;
        gap: 14px;
      }
      .cs-left { position: static; }
      .cs-left-card { border-radius: 16px; padding: 28px; }
      .cs-block-text { padding: 28px; }
      .cs-block { border-radius: 16px; }
      .cs-back { left: 16px; top: 80px; }
    }
  </style>
</head>
<body>

  <!-- NAV (same structure as main page) -->
  <nav class="nav" id="main-nav">
    <a href="../" class="nav-logo" style="text-decoration:none;color:inherit">Ronni</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="../#about">About</a></li>
      <li><a href="../#projects">Projects</a></li>
      <li><a href="../#resume">Resume</a></li>
    </ul>
    <a href="../#contact" class="nav-cta" id="nav-cta">Contact</a>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <ul>
      <li><a href="../#about"    onclick="closeMobileMenu()">About</a></li>
      <li><a href="../#projects" onclick="closeMobileMenu()">Projects</a></li>
      <li><a href="../#resume"   onclick="closeMobileMenu()">Resume</a></li>
      <li><a href="../#contact"  onclick="closeMobileMenu()">Contact</a></li>
    </ul>
  </div>

  <a href="../#projects" class="cs-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    All projects
  </a>

  <!-- Loading -->
  <div class="cs-page" id="cs-loading">
    <div class="cs-loading">
      <span class="cs-loading-dot"></span>
      <span class="cs-loading-dot"></span>
      <span class="cs-loading-dot"></span>
    </div>
  </div>

  <!-- Case study content -->
  <div class="cs-page" id="cs-content" style="display:none">
    <div class="cs-wrap">

      <!-- Left: sticky info panel -->
      <aside class="cs-left">
        <div class="cs-left-card">
          <span class="section-pill" id="cs-pill">• The project</span>
          <h1 class="cs-title" id="cs-title"></h1>
          <p class="cs-desc" id="cs-desc"></p>
          <a class="cs-cta-btn" id="cs-cta" href="#" target="_blank" rel="noopener"></a>
          <div class="cs-meta" id="cs-meta"></div>
        </div>
      </aside>

      <!-- Right: scrollable blocks -->
      <div class="cs-right" id="cs-right"></div>

    </div>
  </div>

  <!-- Not found -->
  <div class="cs-page" id="cs-notfound" style="display:none">
    <div class="cs-notfound">
      <p style="font-size:1.1rem;font-weight:600;color:#1a1a1a">Case study not found</p>
      <a href="../#projects" class="btn btn-dark" style="margin-top:8px">Back to projects</a>
    </div>
  </div>

  <script src="../script.js"></script>
  <script>
    (async function initCaseStudy() {
      const SUPABASE_URL = 'https://ivrrohxxbxhlhxohpwsu.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_CHNjIGQrfC_RxOnT_t9J7Q_XrGa4lzN';

      function show(id) {
        ['cs-loading','cs-content','cs-notfound'].forEach(function(i) {
          document.getElementById(i).style.display = i === id ? '' : 'none';
        });
      }

      function escHtml(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function getEmbedUrl(url) {
        if (!url) return '';
        try {
          if (url.includes('youtube.com/watch')) return 'https://www.youtube.com/embed/' + new URL(url).searchParams.get('v');
          if (url.includes('youtu.be/'))         return 'https://www.youtube.com/embed/' + url.split('youtu.be/')[1].split('?')[0];
          if (url.includes('vimeo.com/'))         return 'https://player.vimeo.com/video/' + url.split('vimeo.com/')[1].split('?')[0];
        } catch {}
        return url;
      }

      function renderBlock(b) {
        if (b.type === 'image') {
          return '<div class="cs-block cs-block-img reveal">' +
            '<img src="' + escHtml(b.src) + '" alt="' + escHtml(b.alt||'') + '" loading="lazy" />' +
            '</div>';
        }
        if (b.type === 'text') {
          return '<div class="cs-block cs-block-text reveal">' +
            (b.pill    ? '<span class="section-pill">' + escHtml(b.pill) + '</span>' : '') +
            (b.heading ? '<h2 class="cs-block-heading">' + escHtml(b.heading) + '</h2>' : '') +
            (b.body    ? '<p class="cs-block-body">'    + escHtml(b.body).replace(/\n/g,'<br>') + '</p>' : '') +
            '</div>';
        }
        if (b.type === 'video') {
          var src = getEmbedUrl(b.url);
          return '<div class="cs-block cs-block-video reveal">' +
            (src ? '<iframe src="' + escHtml(src) + '" allowfullscreen></iframe>' : '') +
            '</div>';
        }
        return '';
      }

      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');

      if (!slug || typeof supabase === 'undefined') { show('cs-notfound'); return; }

      const { createClient } = supabase;
      const db = createClient(SUPABASE_URL, SUPABASE_KEY);

      const { data, error } = await db.from('projects').select('*').eq('slug', slug).single();

      if (error || !data || !data.has_case_study) { show('cs-notfound'); return; }

      // Update page title
      document.title = data.name + ' — Ronni Cohen';

      // Left panel
      const pill = document.getElementById('cs-pill');
      if (data.cs_pill) pill.textContent = data.cs_pill;

      const titleEl = document.getElementById('cs-title');
      titleEl.textContent = data.name;

      const descEl = document.getElementById('cs-desc');
      if (data.cs_description) descEl.textContent = data.cs_description;
      else descEl.style.display = 'none';

      const ctaEl = document.getElementById('cs-cta');
      if (data.cs_cta_label && data.cs_cta_url) {
        ctaEl.textContent = data.cs_cta_label;
        ctaEl.href = data.cs_cta_url;
      } else {
        ctaEl.style.display = 'none';
      }

      const metaEl = document.getElementById('cs-meta');
      var metaRows = data.cs_meta || [];
      if (metaRows.length) {
        metaEl.innerHTML = metaRows.map(function(r) {
          return '<div class="cs-meta-row">' +
            '<span class="cs-meta-label">' + escHtml(r.label) + '</span>' +
            '<span class="cs-meta-value">' + escHtml(r.value) + '</span>' +
            '</div>';
        }).join('');
      } else {
        metaEl.style.display = 'none';
      }

      // Right panel blocks
      var blocks = data.cs_blocks || [];
      var rightEl = document.getElementById('cs-right');
      rightEl.innerHTML = blocks.map(renderBlock).join('');

      // Observe reveals
      rightEl.querySelectorAll('.reveal').forEach(function(el) {
        if (typeof revealObserver !== 'undefined') revealObserver.observe(el);
      });

      show('cs-content');
    })();
  </script>
</body>
</html>
